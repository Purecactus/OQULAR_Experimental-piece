<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OQULAR Experimental Piece</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="hero">
      <section class="intro">
        <p class="eyebrow">EXPERIMENTAL WEB INTERACTION</p>

        <h1>OQULAR</h1>

        <p class="tagline">SCROLL TO FOCUS</p>
      </section>

      <section class="scroll-field">
        <div class="interface-top">
          <p id="counter">01 / 03</p>

          <p>FOCUS MODE</p>
        </div>

        <div class="product-window">
          <div class="glow"></div>

          <div class="strip" id="strip">
            <img src="assets/glasses1.png" alt="Glasses 1" />

            <img src="assets/glasses2.avif" alt="Glasses 2" />

            <img src="assets/glasses3.avif" alt="Glasses 3" />

            <img src="assets/glasses1.png" alt="Glasses 1" />

            <img src="assets/glasses2.avif" alt="Glasses 2" />

            <img src="assets/glasses3.avif" alt="Glasses 3" />
          </div>

          <div class="focus-frame">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="copy" id="copy">
          <h2 id="productTitle">SEE DIFFERENTLY</h2>

          <p id="productText">PRECISION IN MOTION</p>
        </div>

        <div class="scroll-indicator">
          <span></span>

          <p>SCROLL</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
